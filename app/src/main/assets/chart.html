<!DOCTYPE html>
<html>
<head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load("current", { "packages": ["corechart"] });

        function drawChart(dataFromApp) {
            dataFromApp = dataFromApp || [];

            if (typeof dataFromApp == "string") {
                try {
                    dataFromApp = JSON.parse(dataFromApp);
                } catch (e) {
                    console.error("Invalid data format:", e);
                    dataFromApp = [];
                }
            }

            const data = new google.visualization.DataTable();
            data.addColumn('string', 'Emoção');
            data.addColumn('number', 'Quantidade');

            if (dataFromApp && dataFromApp.length > 0) {
                dataFromApp.forEach(item => {
                    data.addRow([item.Emocao, item.Quantidade]);
                });
            }

            const options = {
                hAxis: { title: 'Emoção' },
                vAxis: { title: 'Quantidade', minValue: 0 },
                legend: { position: 'none' },
                width: 400,
                height: 300
            };

            const chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }
    </script>
</head>
<body>
<div id="chart_div"></div>
</body>
</html>
